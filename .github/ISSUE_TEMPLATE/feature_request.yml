name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem are you trying to solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: What would you like to see? }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [report, gate, install-hook, bench, runner-detection, docs, other]
    validations: { required: true }
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: This does not need network calls in report/gate, or printing transcript text.
          required: true
